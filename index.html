<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REISZA Mining & League</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="auth-section">
    <h1>AİB Mining ⛏️</h1>
    <input type="email" id="email" placeholder="E-posta">
    <input type="password" id="password" placeholder="Şifre">
    <button id="login-btn">Giriş</button>
    <button id="register-btn">Kayıt Ol</button>
  </div>

  <div id="game-section" class="hidden">
    <header>
      <h2>🪙 KMR: <span id="kmr-balance">0</span> | 💵 Banknot: <span id="banknote-balance">0</span> | 💳 Çekip: <span id="cekip-balance">0</span></h2>
      <button id="logout-btn">Çıkış</button>
    </header>

    <nav>
      <button class="tab-btn" data-tab="home">Maden</button>
      <button class="tab-btn" data-tab="store">Mağaza</button>
      <button class="tab-btn" data-tab="leaderboard">Sıralama</button>
      <button class="tab-btn" data-tab="finance">Finans</button>
      <button class="tab-btn admin-only" data-tab="admin">Admin Paneli</button>
    </nav>

    <!-- HOME -->
    <section id="home" class="tab active">
      <h3>Madencilerim</h3>
      <div id="miners"></div>
      <button id="collect-btn">💰 Hepsini Topla</button>
    </section>

    <!-- STORE -->
    <section id="store" class="tab">
      <h3>Mağaza</h3>
      <div id="miners-store"></div>
      <button id="buy-chest">🎁 Sandık (1000 KMR)</button>
      <button id="buy-bomb">💣 Bomba Kutusu (5000 KMR)</button>
    </section>

    <!-- LEADERBOARD -->
    <section id="leaderboard" class="tab">
      <h3>🏆 Global Sıralama</h3>
      <ul id="leaderboard-list"></ul>
    </section>

    <!-- FINANCE -->
    <section id="finance" class="tab">
      <h3>💱 Finansal İşlemler</h3>
      <button id="deposit-btn">💸 Para Yatırma Talebi</button>
      <button id="withdraw-btn">🏦 Para Çekme Talebi</button>
      <div id="finance-form"></div>
    </section>

    <!-- ADMIN -->
    <section id="admin" class="tab">
      <h3>👑 Admin Paneli</h3>
      <button id="add-item">Eşya Ekle</button>
      <button id="ban-user">Kullanıcı Banla</button>
      <button id="add-balance">Para Ekle</button>
      <div id="admin-console"></div>
    </section>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
