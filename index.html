<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Madenci Oyunu</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;600;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark-mode">

<!-- SPLASH SCREEN -->
<div id="splash">
  <div class="splash-logo">⛏️</div>
  <div class="splash-title">MADENCİ</div>
  <div class="splash-sub">Kaz • Kazan • Çek</div>
  <div class="splash-bar"><div class="splash-fill"></div></div>
</div>

<!-- ANA UYGULAMA -->
<div id="app" style="display:none">

  <!-- HEADER -->
  <header id="header">
    <div class="header-left">
      <div class="avatar" id="userAvatar">M</div>
      <div class="header-info">
        <div class="header-name" id="headerName">Madenci</div>
        <div class="header-level" id="headerLevel">⚡ Güç: 0</div>
      </div>
    </div>
    <div class="header-right">
      <div class="banknot-badge">
        <span class="banknot-icon">💵</span>
        <span id="headerBanknot">0</span>
      </div>
    </div>
  </header>

  <!-- EKRANLAR -->
  <div id="screens">

    <!-- ANA EKRAN -->
    <div class="screen active" id="screen-home">
      <div class="home-top">
        <div class="power-card">
          <div class="power-label">Toplam Güç</div>
          <div class="power-value" id="totalPower">0</div>
          <div class="power-sub">/ dakika üretim</div>
        </div>
        <div class="banknot-card">
          <div class="banknot-label">💵 Banknot</div>
          <div class="banknot-value" id="banknotValue">0</div>
          <button class="collect-btn" id="collectBtn" onclick="collectBanknot()">TOPLA</button>
        </div>
      </div>

      <!-- MADENCİLER ALANI -->
      <div class="section-title">⛏️ Madencilerim</div>
      <div class="miners-grid" id="minersGrid">
        <!-- JS ile doldurulacak -->
      </div>
    </div>

    <!-- MAĞAZA -->
    <div class="screen" id="screen-shop">
      <div class="screen-header">🛒 Mağaza</div>
      <div class="shop-tabs">
        <button class="shop-tab active" onclick="switchShopTab('items')">Eşyalar</button>
        <button class="shop-tab" onclick="switchShopTab('miners')">Madenciler</button>
      </div>
      <div id="shopItems" class="shop-grid"></div>
      <div id="shopMiners" class="shop-grid" style="display:none"></div>
    </div>

    <!-- LİDERLİK -->
    <div class="screen" id="screen-leaderboard">
      <div class="screen-header">🏆 Liderlik</div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Kullanıcı adı ara..." oninput="searchUser()" />
      </div>
      <div id="leaderboardList"></div>
      <div id="searchResult" style="display:none"></div>
    </div>

    <!-- ÇARK -->
    <div class="screen" id="screen-wheel">
      <div class="screen-header">🎡 Günlük Çark</div>
      <div class="wheel-container">
        <div class="wheel-pointer">▼</div>
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
      </div>
      <div id="wheelStatus" class="wheel-status"></div>
      <button class="spin-btn" id="spinBtn" onclick="spinWheel()">ÇEVİR!</button>
      <div class="wheel-prizes" id="wheelPrizes"></div>
    </div>

    <!-- AYARLAR -->
    <div class="screen" id="screen-settings">
      <div class="screen-header">⚙️ Ayarlar</div>
      <div class="settings-list">

        <div class="settings-section">
          <div class="settings-section-title">Görünüm</div>
          <div class="setting-item">
            <span>🌙 Karanlık Mod</span>
            <label class="toggle">
              <input type="checkbox" id="darkModeToggle" checked onchange="toggleDarkMode()">
              <span class="slider"></span>
            </label>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Hesap</div>
          <div class="setting-item clickable" onclick="showChangePassword()">
            <span>🔑 Şifre Değiştir</span>
            <span class="arrow">›</span>
          </div>
          <div class="setting-item clickable" onclick="showWithdraw()">
            <span>💸 Para Çek</span>
            <span class="arrow">›</span>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Destek</div>
          <div class="setting-item clickable" onclick="showHowToPlay()">
            <span>📖 Nasıl Oynanır?</span>
            <span class="arrow">›</span>
          </div>
          <div class="setting-item clickable" onclick="showAbout()">
            <span>ℹ️ Hakkında</span>
            <span class="arrow">›</span>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">Kripto Değerleri</div>
          <div id="cryptoRates" class="crypto-rates"></div>
        </div>

      </div>
    </div>

  </div>

  <!-- ALT MENÜ -->
  <nav id="bottomNav">
    <button class="nav-btn active" onclick="switchScreen('home')" id="nav-home">
      <span class="nav-icon">⛏️</span>
      <span class="nav-label">Ana</span>
    </button>
    <button class="nav-btn" onclick="switchScreen('shop')" id="nav-shop">
      <span class="nav-icon">🛒</span>
      <span class="nav-label">Mağaza</span>
    </button>
    <button class="nav-btn" onclick="switchScreen('leaderboard')" id="nav-leaderboard">
      <span class="nav-icon">🏆</span>
      <span class="nav-label">Sıralama</span>
    </button>
    <button class="nav-btn" onclick="switchScreen('wheel')" id="nav-wheel">
      <span class="nav-icon">🎡</span>
      <span class="nav-label">Çark</span>
    </button>
    <button class="nav-btn" onclick="switchScreen('settings')" id="nav-settings">
      <span class="nav-icon">⚙️</span>
      <span class="nav-label">Ayarlar</span>
    </button>
  </nav>

</div>

<!-- MODAL -->
<div id="modal" class="modal-overlay" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-body" id="modalBody"></div>
    <button class="modal-close" onclick="closeModal()">Kapat</button>
  </div>
</div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<script src="firebase-config.js"></script>
<script src="game.js"></script>
</body>
</html>
